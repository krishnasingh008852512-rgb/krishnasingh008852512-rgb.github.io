
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishna Gaming Zone</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #202044;
    padding: 20px;
    border-bottom: 3px solid orange;
}

h1 { color: orange; }

.game-box {
    background: #252545;
    width: 94%;
    max-width: 500px;
    margin: 22px auto;
    padding: 20px;
    border-radius: 15px;
}

button {
    background: orange;
    color: black;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    margin: 5px;
    font-size: 17px;
    cursor: pointer;
    touch-action: none;
}

button:hover { background: yellow; }

canvas {
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto;
    margin: 12px auto;
    border: 3px solid white;
    background: #444;
}

#gameArea { display: none; }

#score {
    color: yellow;
    font-size: 21px;
    margin: 10px;
}

#message {
    color: #ffe66d;
    min-height: 25px;
}

footer {
    padding: 20px;
    color: #aaa;
}
</style>
</head>

<body>

<header>
    <h1>🎮 KRISHNA GAMING ZONE</h1>
    <p>Welcome to My Gaming Website</p>
</header>

<div id="home">
    <div class="game-box">
        <h2>🏎️ Car Racing Game</h2>
        <p>दूसरी कारों से बचकर अपना स्कोर बढ़ाएँ।</p>
        <button onclick="startGame('racing')">PLAY RACING</button>
    </div>

    <div class="game-box">
        <h2>🅿️ Car Parking Game</h2>
        <p>अपनी कार को सही जगह पर पार्क करें।</p>
        <button onclick="startGame('parking')">PLAY PARKING</button>
    </div>
</div>

<div class="game-box" id="gameArea">
    <h2 id="gameTitle">Game</h2>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="600"></canvas>
    <p id="message">गेम शुरू करें!</p>

    <div>
        <button id="leftBtn">⬅ LEFT</button>
        <button id="upBtn">⬆ UP</button>
        <button id="downBtn">⬇ DOWN</button>
        <button id="rightBtn">RIGHT ➡</button>
    </div>

    <button onclick="startGame(currentGame)">RESTART</button>
    <button onclick="goHome()">HOME</button>
</div>

<footer>
    <p>Created by Krishna ❤️</p>
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let currentGame = "";
let running = false;
let score = 0;
let player;
let enemies = [];
let keys = {};
let animationId;
let parkingWon = false;

let touch = {
    left: false,
    right: false,
    up: false,
    down: false
};

document.addEventListener("keydown", e => {
    keys[e.key] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function controlButton(id, direction) {
    const btn = document.getElementById(id);

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        touch[direction] = true;
    });

    ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
        btn.addEventListener(event, () => {
            touch[direction] = false;
        });
    });
}

controlButton("leftBtn", "left");
controlButton("rightBtn", "right");
controlButton("upBtn", "up");
controlButton("downBtn", "down");

function startGame(type) {
    cancelAnimationFrame(animationId);

    currentGame = type;
    running = true;
    score = 0;
    enemies = [];
    parkingWon = false;

    keys = {};
    touch = {left:false, right:false, up:false, down:false};

    document.getElementById("home").style.display = "none";
    document.getElementById("gameArea").style.display = "block";
    document.getElementById("message").innerText = "";

    if (type === "racing") {
        document.getElementById("gameTitle").innerText = "🏎️ Car Racing";
        player = {x:175, y:500, w:50, h:80};
    } else {
        document.getElementById("gameTitle").innerText = "🅿️ Car Parking";
        player = {x:175, y:480, angle:0, speed:0};
    }

    gameLoop();
}

function goHome() {
    running = false;
    cancelAnimationFrame(animationId);
    document.getElementById("gameArea").style.display = "none";
    document.getElementById("home").style.display = "block";
}

function drawCar(x, y, color, angle = 0) {
    ctx.save();
    ctx.translate(x + 25, y + 40);
    ctx.rotate(angle);

    ctx.fillStyle = color;
    ctx.fillRect(-25, -40, 50, 80);

    ctx.fillStyle = "#9eeaff";
    ctx.fillRect(-17, -28, 34, 20);

    ctx.fillStyle = "black";
    ctx.fillRect(-29, -25, 7, 20);
    ctx.fillRect(22, -25, 7, 20);
    ctx.fillRect(-29, 15, 7, 20);
    ctx.fillRect(22, 15, 7, 20);

    ctx.restore();
}

// CAR RACING GAME

function racingGame() {
    ctx.fillStyle = "#555";
    ctx.fillRect(50, 0, 300, 600);

    ctx.fillStyle = "white";
    ctx.fillRect(45, 0, 5, 600);
    ctx.fillRect(350, 0, 5, 600);

    ctx.fillStyle = "yellow";

    for (let y = 0; y < 600; y += 100) {
        ctx.fillRect(197, (y + score * 4) % 600, 6, 50);
    }

    if (keys.ArrowLeft || keys.a || touch.left)
        player.x -= 6;

    if (keys.ArrowRight || keys.d || touch.right)
        player.x += 6;

    player.x = Math.max(55, Math.min(295, player.x));

    drawCar(player.x, player.y, "blue");

    if (Math.random() < 0.025) {
        enemies.push({
            x: 60 + Math.random() * 240,
            y: -80
        });
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];
        enemy.y += 5;

        drawCar(enemy.x, enemy.y, "red");

        if (
            player.x < enemy.x + 50 &&
            player.x + 50 > enemy.x &&
            player.y < enemy.y + 80 &&
            player.y + 80 > enemy.y
        ) {
            endGame("GAME OVER! Restart दबाएँ।");
            return;
        }

        if (enemy.y > 600) {
            enemies.splice(i, 1);
            score++;
        }
    }

    document.getElementById("score").innerText =
        "Score: " + score;
}

// CAR PARKING GAME

const parkingSpot = {
    x: 145,
    y: 65,
    w: 110,
    h: 155
};

const obstacles = [
    {x: 65, y: 285, w: 75, h: 90},
    {x: 260, y: 285, w: 75, h: 90},
    {x: 65, y: 440, w: 75, h: 90},
    {x: 260, y: 440, w: 75, h: 90}
];

function parkingGame() {
    // Parking area
    ctx.fillStyle = "#555";
    ctx.fillRect(25, 20, 350, 560);

    // Parking lines
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.strokeRect(
        parkingSpot.x,
        parkingSpot.y,
        parkingSpot.w,
        parkingSpot.h
    );

    ctx.fillStyle = "#aaffaa";
    ctx.font = "18px Arial";
    ctx.fillText("PARK HERE", 155, 55);

    // Obstacles
    obstacles.forEach(o => {
        ctx.fillStyle = "#cc3333";
        ctx.fillRect(o.x, o.y, o.w, o.h);

        ctx.fillStyle = "white";
        ctx.font = "15px Arial";
        ctx.fillText("BLOCK", o.x + 8, o.y + 48);
    });

    // Car controls
    if (!parkingWon) {
        if (touch.up || keys.ArrowUp || keys.w)
            player.speed = Math.min(player.speed + 0.12, 2.5);

        else if (touch.down || keys.ArrowDown || keys.s)
            player.speed = Math.max(player.speed - 0.12, -2);

        else
            player.speed *= 0.94;

        if (touch.left || keys.ArrowLeft || keys.a)
            player.angle -= 0.035;

        if (touch.right || keys.ArrowRight || keys.d)
            player.angle += 0.035;

        let oldX = player.x;
        let oldY = player.y;

        player.x += Math.sin(player.angle) * player.speed;
        player.y -= Math.cos(player.angle) * player.speed;

        // Boundary collision
        if (player.x < 50 || player.x > 300 ||
            player.y < 20 || player.y > 500) {
            player.x = oldX;
            player.y = oldY;
            player.speed = 0;
            document.getElementById("message").innerText =
                "दीवार से बचकर चलाएँ!";
        }

        // Obstacle collision
        obstacles.forEach(o => {
            if (
                player.x + 15 < o.x + o.w &&
                player.x + 35 > o.x &&
                player.y + 15 < o.y + o.h &&
                player.y + 65 > o.y
            ) {
                player.x = oldX;
                player.y = oldY;
                player.speed = 0;
                document.getElementById("message").innerText =
                    "रुकिए! सामने बाधा है।";
            }
        });

        // Parking success
        if (
            player.x > 155 && player.x < 205 &&
            player.y > 105 && player.y < 155 &&
            Math.abs(player.speed) < 0.25 &&
            Math.abs(player.angle) < 0.25
        ) {
            parkingWon = true;
            player.speed = 0;
            document.getElementById("message").innerText =
                "🎉 शाबाश! आपने सही पार्किंग की!";
            score = 1;
        }
    }

    drawCar(player.x, player.y, "blue", player.angle);

    document.getElementById("score").innerText =
        "Parking: " + (parkingWon ? "Complete!" : "Not Complete");
}

function endGame(message) {
    running = false;
    document.getElementById("message").innerText = message;
}

function gameLoop() {
    if (!running) return;

    ctx.clearRect(0, 0, 400, 600);

    if (currentGame === "racing") {
        racingGame();
    } else {
        parkingGame();
    }

    if (running) {
        animationId = requestAnimationFrame(gameLoop);
    }
}
</script>

</body>
</html>
