
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Gaming Zone</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #202044;
    padding: 20px;
    border-bottom: 3px solid orange;
}

h1 { color: orange; }

.game-box {
    background: #222244;
    width: 95%;
    max-width: 500px;
    margin: 25px auto;
    padding: 20px;
    border-radius: 15px;
}

button {
    background: orange;
    color: black;
    border: 0;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover { background: yellow; }

canvas {
    background: #444;
    border: 3px solid white;
    width: 100%;
    max-width: 400px;
    display: block;
    margin: auto;
}

#gameArea { display: none; }

#score {
    color: yellow;
    font-size: 22px;
    margin: 12px;
}

footer {
    padding: 20px;
    color: #aaa;
}
</style>
</head>

<body>

<header>
    <h1>🎮 KRISHNA GAMING ZONE</h1>
    <p>Welcome to My Gaming Website</p>
</header>

<div class="game-box" id="home">
    <h2>🏎️ Car Racing Game</h2>
    <p>अपनी कार चलाएँ और दूसरी कारों से बचें!</p>
    <button onclick="startGame()">PLAY GAME</button>
</div>

<div class="game-box" id="gameArea">
    <h2>🏎️ Car Racing</h2>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="600"></canvas>

    <div>
        <button onpointerdown="moveLeft=true"
                onpointerup="moveLeft=false"
                onpointerleave="moveLeft=false">⬅ LEFT</button>

        <button onpointerdown="moveRight=true"
                onpointerup="moveRight=false"
                onpointerleave="moveRight=false">RIGHT ➡</button>
    </div>

    <button onclick="startGame()">RESTART</button>
    <button onclick="goHome()">HOME</button>
</div>

<div class="game-box">
    <h2>🐍 Snake Game</h2>
    <p>Coming Soon!</p>
</div>

<footer>
    <p>Created by Krishna ❤️</p>
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, enemies, score, gameRunning;
let moveLeft = false;
let moveRight = false;
let keys = {};

function startGame() {
    document.getElementById("home").style.display = "none";
    document.getElementById("gameArea").style.display = "block";

    player = { x: 175, y: 500, w: 50, h: 80 };
    enemies = [];
    score = 0;
    gameRunning = true;

    moveLeft = false;
    moveRight = false;

    requestAnimationFrame(gameLoop);
}

function goHome() {
    gameRunning = false;
    document.getElementById("gameArea").style.display = "none";
    document.getElementById("home").style.display = "block";
}

document.addEventListener("keydown", function(e) {
    keys[e.key] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key] = false;
});

function drawCar(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 50, 80);

    ctx.fillStyle = "#99ddff";
    ctx.fillRect(x + 9, y + 10, 32, 20);

    ctx.fillStyle = "black";
    ctx.fillRect(x - 5, y + 12, 8, 20);
    ctx.fillRect(x + 47, y + 12, 8, 20);
    ctx.fillRect(x - 5, y + 52, 8, 20);
    ctx.fillRect(x + 47, y + 52, 8, 20);
}

function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, 400, 600);

    // Road
    ctx.fillStyle = "#555";
    ctx.fillRect(50, 0, 300, 600);

    // Road borders
    ctx.fillStyle = "white";
    ctx.fillRect(45, 0, 5, 600);
    ctx.fillRect(350, 0, 5, 600);

    // Road lines
    ctx.fillStyle = "yellow";
    for (let y = 0; y < 600; y += 100) {
        ctx.fillRect(197, (y + score * 4) % 600, 6, 50);
    }

    // Player movement
    if (keys["ArrowLeft"] || keys["a"] || moveLeft) {
        player.x -= 6;
    }

    if (keys["ArrowRight"] || keys["d"] || moveRight) {
        player.x += 6;
    }

    if (player.x < 55) player.x = 55;
    if (player.x > 295) player.x = 295;

    drawCar(player.x, player.y, "blue");

    // Create enemy cars
    if (Math.random() < 0.025) {
        let x = 60 + Math.random() * 240;
        enemies.push({ x: x, y: -80 });
    }

    // Move enemy cars
    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];
        enemy.y += 5;

        drawCar(enemy.x, enemy.y, "red");

        // Collision check
        if (
            player.x < enemy.x + 50 &&
            player.x + 50 > enemy.x &&
            player.y < enemy.y + 80 &&
            player.y + 80 > enemy.y
        ) {
            gameRunning = false;
            ctx.fillStyle = "white";
            ctx.font = "40px Arial";
            ctx.fillText("GAME OVER", 85, 290);
            ctx.font = "20px Arial";
            ctx.fillText("Press RESTART", 125, 330);
            return;
        }

        if (enemy.y > 600) {
            enemies.splice(i, 1);
            score++;
        }
    }

    document.getElementById("score").innerText =
        "Score: " + score;

    requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
